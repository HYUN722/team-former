name: DB 깨우기

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: psql install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: ping db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "select count(*) from tf_students;"
